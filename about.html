<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>关于我 - 我的博客</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <header class="header">
    <div class="container">
      <div class="logo"><a href="index.html">✍️ 我的博客</a></div>
      <nav class="nav">
        <a href="index.html">首页</a>
        <a href="about.html" class="active">关于我</a>
      </nav>
      <button class="theme-toggle" id="themeToggle" title="切换深色/浅色模式">🌙</button>
    </div>
  </header>

  <section class="hero">
    <div class="container">
      <h1>关于我</h1>
      <p id="hero-subtitle">一个普通人，喜欢记录生活、分享想法</p>
    </div>
  </section>

  <div class="about-page" id="about-content">
    <div class="about-card" style="text-align:center;">
      <p style="color:var(--text-muted)">加载中...</p>
    </div>
  </div>

  <footer class="footer">
    <div class="container">
      <p id="footer-name">© 2026 我的博客 · 用心记录每一天</p>
      <p class="footer-links">
        <a href="index.html">首页</a> ·
        <a href="about.html">关于</a>
      </p>
    </div>
  </footer>

  <script src="js/main.js"></script>
  <script>
    fetch('posts.json?t=' + Date.now())
      .then(r => r.json())
      .then(data => {
        const a = data.about || {};
        const avatar   = a.avatar   || '😊';
        const name     = a.name     || '你好，我是博主';
        const tagline  = a.tagline  || '记录者 · 思考者 · 生活爱好者';
        const bio      = a.bio      || '';
        const hobbies  = a.hobbies  || [];
        const blogName = a.blogName || '我的博客';

        document.title = '关于我 - ' + blogName;
        if (a.blogSubtitle) document.getElementById('hero-subtitle').textContent = a.blogSubtitle.slice(0,30) + '...';
        document.getElementById('footer-name').textContent = '© 2026 ' + blogName + ' · 用心记录每一天';

        const bioHtml = bio.split('\n\n').filter(p => p.trim())
          .map(p => `<p>${p.trim()}</p>`).join('');

        const hobbiesHtml = hobbies.length
          ? `<h3 style="font-size:1rem;margin-bottom:14px;color:var(--text);">我喜欢的事情</h3>
             <div class="skills">${hobbies.map(h => `<span class="skill-tag">${h}</span>`).join('')}</div>`
          : '';

        document.getElementById('about-content').innerHTML = `
          <div class="about-card">
            <div class="about-avatar">${avatar}</div>
            <h1>${name}</h1>
            <p class="tagline">✍️ ${tagline}</p>
            <div class="bio">${bioHtml}</div>
            ${hobbiesHtml}
          </div>
          <div class="about-card" style="margin-top:24px;">
            <h2 style="font-size:1.2rem;margin-bottom:20px;border-bottom:2px solid var(--primary);padding-bottom:10px;display:inline-block;">📊 博客数据</h2>
            <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:20px;text-align:center;">
              <div>
                <div style="font-size:2rem;font-weight:700;color:var(--primary);">${(data.posts||[]).length}</div>
                <div style="font-size:0.9rem;color:var(--text-muted);">篇文章</div>
              </div>
              <div>
                <div style="font-size:2rem;font-weight:700;color:var(--primary);">${new Set((data.posts||[]).map(p=>p.category)).size}</div>
                <div style="font-size:0.9rem;color:var(--text-muted);">个分类</div>
              </div>
              <div>
                <div style="font-size:2rem;font-weight:700;color:var(--primary);">2026</div>
                <div style="font-size:0.9rem;color:var(--text-muted);">年创建</div>
              </div>
            </div>
          </div>
          <div class="about-card" style="margin-top:24px;text-align:center;">
            <h2 style="font-size:1.2rem;margin-bottom:16px;">📬 联系我</h2>
            <p style="color:var(--text-light);font-size:0.95rem;">如果你想和我交流，欢迎在文章下面留言，我会认真回复每一条评论。</p>
            <a href="index.html" class="btn-outline" style="margin-top:16px;display:inline-block;">去看看文章 →</a>
          </div>
        `;
      })
      .catch(() => {
        document.getElementById('about-content').innerHTML = `
          <div class="about-card" style="text-align:center;">
            <div class="about-avatar">😊</div>
            <h1>你好，我是博主</h1>
            <p class="tagline">✍️ 记录者 · 思考者 · 生活爱好者</p>
          </div>`;
      });
  </script>
</body>
</html>

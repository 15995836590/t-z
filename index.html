<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>我的博客 - 记录生活，分享思考</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <header class="header">
    <div class="container">
      <div class="logo"><a href="index.html">✍️ 我的博客</a></div>
      <nav class="nav">
        <a href="index.html" class="active">首页</a>
        <a href="list.html">所有文章</a>
        <a href="about.html">关于我</a>
      </nav>
      <button class="theme-toggle" id="themeToggle" title="切换深色/浅色模式">🌙</button>
    </div>
  </header>

  <section class="hero">
    <div class="container">
      <h1>欢迎来到我的博客</h1>
      <p>记录生活点滴，分享所思所想，留住每一个美好的瞬间</p>
    </div>
  </section>

  <main class="main">
    <div class="container layout">

      <section class="posts-section">
        <h2 class="section-title">最新文章</h2>
        <div id="posts-container">
          <div class="loading">加载中...</div>
        </div>
      </section>

      <aside class="sidebar">
        <div class="widget">
          <h3 class="widget-title">🔍 搜索</h3>
          <div class="search-box">
            <input type="text" id="searchInput" placeholder="搜索文章..." />
            <button onclick="searchPosts()">搜索</button>
          </div>
        </div>
        <div class="widget">
          <h3 class="widget-title">👤 关于博主</h3>
          <div class="about-widget">
            <div class="avatar">😊</div>
            <p>你好！我是这个博客的作者。<br/>喜欢记录生活，分享想法。</p>
            <a href="about.html" class="btn-outline">了解更多</a>
          </div>
        </div>
        <div class="widget">
          <h3 class="widget-title">📂 文章分类</h3>
          <ul class="category-list" id="category-list">
            <li><a href="#">加载中...</a></li>
          </ul>
        </div>
        <div class="widget">
          <h3 class="widget-title">🕐 最新文章</h3>
          <ul class="recent-posts" id="recent-posts">
            <li><a href="#">加载中...</a></li>
          </ul>
        </div>
      </aside>

    </div>
  </main>

  <footer class="footer">
    <div class="container">
      <p>© 2026 我的博客 · 用心记录每一天</p>
      <p class="footer-links">
        <a href="index.html">首页</a> ·
        <a href="list.html">所有文章</a> ·
        <a href="about.html">关于</a> ·
        <a href="admin.html" style="color:var(--text-muted); font-size:0.8rem;">管理</a>
      </p>
    </div>
  </footer>

  <script src="js/main.js"></script>
  <script>
    // 加载并渲染文章列表
    fetch('posts.json?t=' + Date.now())
      .then(r => r.json())
      .then(data => {
        const posts = data.posts.sort((a, b) => b.id - a.id);
        renderPosts(posts);
        renderSidebar(posts);
      })
      .catch(() => {
        document.getElementById('posts-container').innerHTML =
          '<p style="color:var(--text-muted)">暂无文章</p>';
      });

    function renderPosts(posts) {
      const container = document.getElementById('posts-container');
      if (!posts.length) {
        container.innerHTML = '<p style="color:var(--text-muted)">暂无文章，去<a href="admin.html">后台</a>写第一篇吧！</p>';
        return;
      }
      container.innerHTML = posts.map((p, i) => `
        <article class="post-card" style="animation-delay:${i * 0.1}s">
          <div class="post-meta">
            <span class="post-date">📅 ${formatDate(p.date)}</span>
            <span class="post-tag">${p.category}</span>
          </div>
          <h3 class="post-title">
            <a href="post.html?id=${p.id}">${p.title}</a>
          </h3>
          <p class="post-excerpt">${p.excerpt}</p>
          <a href="post.html?id=${p.id}" class="read-more">阅读全文 →</a>
        </article>
      `).join('');
    }

    function renderSidebar(posts) {
      // 分类统计
      const cats = {};
      posts.forEach(p => { cats[p.category] = (cats[p.category] || 0) + 1; });
      document.getElementById('category-list').innerHTML =
        Object.entries(cats).map(([cat, count]) => `
          <li><a href="#"><span>${cat}</span><span>${count}</span></a></li>
        `).join('') || '<li><a href="#">暂无分类</a></li>';

      // 最新文章（前5篇）
      document.getElementById('recent-posts').innerHTML =
        posts.slice(0, 5).map(p => `
          <li><a href="post.html?id=${p.id}">${p.title}</a></li>
        `).join('') || '<li><a href="#">暂无文章</a></li>';
    }

    function formatDate(dateStr) {
      if (!dateStr) return '';
      const [y, m, d] = dateStr.split('-');
      return `${y}年${parseInt(m)}月${parseInt(d)}日`;
    }

    function searchPosts() {
      const kw = document.getElementById('searchInput').value.trim();
      if (!kw) { alert('请输入搜索关键词'); return; }
      fetch('posts.json?t=' + Date.now())
        .then(r => r.json())
        .then(data => {
          const results = data.posts.filter(p =>
            p.title.includes(kw) || p.excerpt.includes(kw) ||
            p.content.includes(kw) || p.category.includes(kw)
          );
          if (!results.length) { alert(`没有找到"${kw}"相关文章`); return; }
          renderPosts(results);
          document.querySelector('.section-title').textContent = `搜索"${kw}"的结果（${results.length}篇）`;
        });
    }

    document.getElementById('searchInput').addEventListener('keydown', e => {
      if (e.key === 'Enter') searchPosts();
    });
  </script>
</body>
</html>
